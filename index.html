<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppGym">
  <title>AppGym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="rest" class="rest" hidden></div>

  <nav id="tabs" class="tabs">
    <button data-view="home"><span class="ti">🏠</span>Inicio</button>
    <button data-view="calendar"><span class="ti">📅</span>Calendario</button>
    <button data-view="settings"><span class="ti">⚙️</span>Ajustes</button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-bg" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
  </div>

  <div id="howto" class="howto" role="dialog" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
